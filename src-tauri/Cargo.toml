[package]
name = "piano-tect-tauri"
version = "0.1.0"
description = "Piano Tect Tauri — Physical Modeling Virtual Piano Studio"
authors = ["Piano Tect Contributors"]
edition = "2021"

[lib]
name = "piano_tect_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
cpal = "0.15"
midir = "0.10"
hound = "3.5"
parking_lot = "0.12"

[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
